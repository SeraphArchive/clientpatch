[package]
name = "clientpatch"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "Mod loader for Heaven Burns Red"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinHttp",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
retour = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# unwind so detour `catch_unwind` actually works. Detour bodies must still
# fence panics — unwinding into game/Win32 frames is UB.
panic = "unwind"
strip = true
