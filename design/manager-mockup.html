<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clientpatch manager</title>
<style>
  :root{
    --bg:#f3f3f3; --mica:linear-gradient(135deg,#eef1f6 0%,#e7ecf4 40%,#eae6f2 100%);
    --card:#ffffffcc; --card-solid:#ffffff; --stroke:#00000014; --stroke-strong:#0000001f;
    --text:#1a1a1a; --text-2:#5c5c5c; --text-3:#8a8a8a;
    --accent:#0067c0; --accent-hover:#1975c5; --accent-soft:#0067c014;
    --good:#0f7b0f; --warn:#9d5d00; --bad:#c42b1c;
    --nav-w:224px; --radius:8px; --radius-lg:10px;
    --mono:"Cascadia Code",Consolas,"SF Mono",monospace;
    --sans:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","PingFang SC","Hiragino Sans","Malgun Gothic",system-ui,sans-serif;
  }
  html.dark{
    --bg:#202020; --mica:linear-gradient(135deg,#26262b 0%,#212127 40%,#282430 100%);
    --card:#2b2b2bcc; --card-solid:#2b2b2b; --stroke:#ffffff12; --stroke-strong:#ffffff24;
    --text:#f2f2f2; --text-2:#c8c8c8; --text-3:#9a9a9a;
    --accent:#60cdff; --accent-hover:#7ad4ff; --accent-soft:#60cdff1a;
    --good:#6ccb5f; --warn:#fce100; --bad:#ff99a4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .window{max-width:1080px;height:720px;margin:24px auto;background:var(--mica);border:1px solid var(--stroke-strong);border-radius:12px;overflow:hidden;box-shadow:0 24px 64px #00000033;display:flex;flex-direction:column}
  .titlebar{height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;flex:none}
  .titlebar .app{font-weight:600;font-size:13px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .titlebar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .titlebar .spacer{flex:1}
  .titlebar .caption{display:flex;gap:2px}
  .titlebar .cap{width:38px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--text-2)}
  .titlebar .cap:hover{background:#00000010}
  html.dark .titlebar .cap:hover{background:#ffffff14}
  .titlebar .cap.close:hover{background:#c42b1c;color:#fff}
  .shell{flex:1;display:flex;min-height:0}
  .nav{width:var(--nav-w);flex:none;padding:8px;display:flex;flex-direction:column;gap:2px}
  .nav .navitem{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:var(--radius);color:var(--text);cursor:pointer;position:relative;font-size:14px;user-select:none}
  .nav .navitem .ico{width:20px;text-align:center;font-size:16px;opacity:.9}
  .nav .navitem:hover{background:#00000008}
  html.dark .nav .navitem:hover{background:#ffffff0d}
  .nav .navitem.active{background:var(--card)}
  .nav .navitem.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
  .nav .grow{flex:1}
  .content{flex:1;min-width:0;background:var(--card);border-top-left-radius:12px;margin:0 8px 8px 0;border:1px solid var(--stroke);overflow:auto;padding:28px 32px}
  h1.page{font-size:26px;font-weight:600;margin:0 0 22px}
  .card{background:var(--card-solid);border:1px solid var(--stroke);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px;font-weight:600}
  .row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--stroke)}
  .row:last-child{border-bottom:none}
  .row .label{flex:1}
  .row .label .t{font-weight:500}
  .row .label .d{color:var(--text-3);font-size:12.5px}
  .status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
  .stat{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--stroke);border-radius:var(--radius-lg);background:var(--card-solid)}
  .stat .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex:none}
  .stat .ic.ok{background:#0f7b0f18;color:var(--good)}
  .stat .ic.hash{background:var(--accent-soft);color:var(--accent)}
  .stat .m .k{color:var(--text-3);font-size:12px}
  .stat .m .v{font-weight:600}
  .stat .m .v.mono{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .btn{height:34px;padding:0 16px;border-radius:6px;border:1px solid var(--stroke-strong);background:var(--card-solid);color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:#00000006}
  html.dark .btn:hover{background:#ffffff0a}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  html.dark .btn.primary{color:#003a5d}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.big{height:40px;padding:0 22px;font-size:15px;font-weight:600}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:#00000008}
  .split{display:flex}
  .split .btn.primary{border-top-right-radius:0;border-bottom-right-radius:0}
  .split .btn.caret{border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid #ffffff33;padding:0 10px;background:var(--accent);color:#fff;border-color:transparent}
  html.dark .split .btn.caret{color:#003a5d;border-left:1px solid #00000022}
  .sw{width:42px;height:22px;border-radius:12px;background:#8a8a8a55;position:relative;cursor:pointer;flex:none;transition:background .15s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px #0003}
  .sw.on{background:var(--accent)}
  .sw.on::after{left:23px}
  .pill{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600}
  .pill.gray{background:#8a8a8a22;color:var(--text-2)}
  .pill.good{background:#0f7b0f18;color:var(--good)}
  .pill.warn{background:#9d5d0018;color:var(--warn)}
  .pill.acc{background:var(--accent-soft);color:var(--accent)}
  input.txt,select.txt{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--stroke-strong);background:var(--card-solid);color:var(--text);font-family:inherit;font-size:13.5px;min-width:220px}
  input.txt:focus,select.txt:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .seg{display:inline-flex;border:1px solid var(--stroke-strong);border-radius:7px;overflow:hidden}
  .seg button{height:30px;padding:0 14px;border:none;background:transparent;color:var(--text-2);font-family:inherit;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  html.dark .seg button.on{color:#003a5d}
  .editor{background:#1e1e1e;border-radius:8px;border:1px solid var(--stroke);overflow:hidden}
  html:not(.dark) .editor{background:#1e1e1e}
  .editor .bar{height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#00000022;color:#ccc;font-size:12px;border-bottom:1px solid #ffffff10}
  .editor pre{margin:0;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#d4d4d4;overflow:auto;max-height:360px}
  .editor .sec{color:#569cd6}.editor .key{color:#9cdcfe}.editor .str{color:#ce9178}.editor .cm{color:#6a9955}.editor .bool{color:#569cd6}
  .plug{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--stroke)}
  .plug:last-child{border-bottom:none}
  .plug .pico{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:none}
  .plug .pmeta{flex:1;min-width:0}
  .plug .pmeta .pn{font-weight:600}
  .plug .pmeta .pd{color:var(--text-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .steps{display:flex;flex-direction:column;gap:6px;margin:2px 0}
  .step{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px;border:1px solid var(--stroke)}
  .step .sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;background:#8a8a8a22;color:var(--text-2)}
  .step.done .sn{background:var(--good);color:#fff}
  .step.run .sn{background:transparent}
  .step .stxt{flex:1}
  .step .stxt .sd{color:var(--text-3);font-size:12.5px}
  .spin{width:20px;height:20px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .console{background:#1a1a1a;border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12px;color:#c8c8c8;line-height:1.65;max-height:170px;overflow:auto;margin-top:12px}
  .console .dim{color:#7a7a7a}.console .acc{color:#60cdff}.console .ok{color:#6ccb5f}
  .banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;margin-bottom:16px;border:1px solid}
  .banner.warn{background:#9d5d000f;border-color:#9d5d0033;color:var(--warn)}
  .banner.good{background:#0f7b0f0f;border-color:#0f7b0f33;color:var(--good)}
  .banner .bt{flex:1;color:var(--text)}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .topbar .spacer{flex:1}
  .hint{font-size:12.5px;color:var(--text-3);margin-top:8px}
  .hidden{display:none!important}
</style>
</head>

<div class="window">

    </div>
    <div class="content" id="content"></div>
  </div>
</div>

function plug(ic,name,desc,on){return `<div class="plug"><div class="pico">${ic}</div><div class="pmeta"><div class="pn">${name}</div><div class="pd">${desc}</div></div><span class="pill ${on?"good":"gray"}">${on?t("plugEnabled"):t("plugDisabled")}</span><div class="sw ${on?"on":""}" data-sw></div></div>`;}
function step(n,state,k,d){const sn=state==="run"?'<span class="spin"></span>':`<div class="sn">${state==="done"?"✓":n}</div>`;return `<div class="step ${state}">${sn}<div class="stxt"><div>${t(k)}</div><div class="sd">${t(d)}</div></div></div>`;}

let PAGE="home";
function render(){
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.getElementById("content").innerHTML=PAGES[PAGE]();
  bind();
}
function bind(){
  document.querySelectorAll("[data-sw]").forEach(s=>s.onclick=()=>s.classList.toggle("on"));
  const tabs=document.getElementById("modTabs");
  if(tabs)tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    tabs.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    document.getElementById("modForm").classList.toggle("hidden",b.dataset.tab!=="form");
    document.getElementById("modToml").classList.toggle("hidden",b.dataset.tab!=="toml");
  });
  const th=document.getElementById("thSeg");
  if(th)th.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    th.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    const m=b.dataset.th;const sys=matchMedia("(prefers-color-scheme:dark)").matches;
    document.documentElement.classList.toggle("dark",m==="dark"||(m==="system"&&sys));
  });
  const ls=document.getElementById("langSel");
  if(ls){ls.value=LANG;ls.onchange=e=>{LANG=e.target.value==="system"?"zh-Hans":e.target.value;document.documentElement.lang=LANG;render();};}
  const gen=document.getElementById("genBtn");
  if(gen)gen.onclick=()=>{gen.textContent=t("interopGenRun");gen.classList.remove("primary");};
  const caret=document.getElementById("launchCaret");
  if(caret)caret.onclick=()=>{const m=document.getElementById("launchMode");m.textContent=m.textContent===t("viaSteam")?t("direct"):t("viaSteam");};
}
document.getElementById("nav").querySelectorAll(".navitem").forEach(n=>n.onclick=()=>{
  document.querySelectorAll("#nav .navitem").forEach(x=>x.classList.remove("active"));
  n.classList.add("active");PAGE=n.dataset.page;render();
});
